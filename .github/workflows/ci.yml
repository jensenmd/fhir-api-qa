name: FHIR API QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fhir-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite (smoke gate first)
        run: python -m pytest -v --junitxml=reports/junit.xml --html=reports/pytest-report.html --self-contained-html
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-test-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
