name: FHIR API QA

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"  # weekly Monday health check

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest -v
